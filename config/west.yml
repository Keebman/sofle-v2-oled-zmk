manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # Use the current upstream ZMK branch so Studio support and board definitions
      # remain compatible with the current Zephyr toolchain.
      revision: main
      import: app/west.yml
  self:
    path: config
